[package]
name = "logos-checker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone checker for portable Logos proofs"
license = "MIT"
repository = "https://github.com/gia-uh/logos"
homepage = "https://logos.uhgia.org/"
keywords = ["theorem-prover", "proof-checker", "logic"]
categories = ["science", "development-tools"]

[[bin]]
name = "logos"
path = "src/main.rs"

[dependencies]
num-bigint = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

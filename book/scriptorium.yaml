# The English book. Every code block runs from this directory when the book is
# built; the installed `logos` executable must be on PATH. The Spanish pages in
# book/ are regression fixtures and are not part of this project.
theme: book
execute: {timeout: 120, freeze: file}

vars:
  title: "Logos"
  subtitle: "Proofs a machine can check"

files:
  - chapters/00-introduction.md
  - chapters/01-quick-start.md
  - chapters/02-first-proof.md
  - chapters/03-conjunction.md
  - chapters/04-cases.md
  - chapters/05-witnesses.md
  - chapters/06-definitions.md
  - chapters/07-parity.md
  - chapters/08-neighbours.md
  - chapters/09-factorial.md
  - chapters/10-least-prime.md
  - chapters/11-euclid.md
  - chapters/12-finite-graph.md
  - chapters/13-binary-search.md
  - chapters/14-production-contract.md
  - chapters/15-developer-guide.md
  - chapters/16-api-reference.md

outputs:
  site:
    format: docs
    dir: site
    repo-url: https://github.com/gia-uh/logos
    edit-path: book
  print:
    format: pdf
    file: book.pdf

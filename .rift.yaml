# Keep the syntactic source inventory available for maintenance. Chapter 15
# documents the supported imports separately. The generator checks both files.
rules:

  - name: "every public class is named in the book"
    extract:
      file: "logos/**/*.py"
      regex: '^class ([A-Za-z]\w*)'
    require:
      in: "book/**/*.md"
      as: word

  - name: "every public function and method is named in the book"
    severity: warning
    extract:
      file: "logos/**/*.py"
      regex: '^def ([a-z]\w*)|^    def ([a-z]\w*)\((?:self|cls)\b'
    require:
      in: "book/**/*.md"
      as: word

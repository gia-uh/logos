# The book covers the library. Every public class is named somewhere in the
# chapters; every public function and method is named too, as a warning because
# a short name such as `solve` or `key` also occurs in ordinary prose. The
# generated reference chapter makes the coverage mechanical.
rules:

  - name: "every public class is named in the book"
    extract:
      file: "logos/**/*.py"
      regex: '^class ([A-Za-z]\w*)'
    require:
      in: "book/chapters/*.md"
      as: word

  - name: "every public function and method is named in the book"
    severity: warning
    extract:
      file: "logos/**/*.py"
      regex: '^def ([a-z]\w*)|^    def ([a-z]\w*)\((?:self|cls)\b'
    require:
      in: "book/chapters/*.md"
      as: word

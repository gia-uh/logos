name: English book

on:
  pull_request:
    paths:
      - 'book/**'
      - 'logos/**'
      - 'checker/**'
      - 'tests/test_english_book.py'
      - 'tests/test_first_proof_chapter.py'
      - 'tests/test_developer_guide.py'
      - 'tests/test_book_reading.py'
      - '.github/workflows/book.yml'
      - '.rift.yaml'
      - 'tools/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'logos/**'
      - 'checker/**'
      - 'tests/test_english_book.py'
      - 'tests/test_first_proof_chapter.py'
      - 'tests/test_developer_guide.py'
      - 'tests/test_book_reading.py'
      - '.github/workflows/book.yml'
      - '.rift.yaml'
      - 'tools/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3

      - name: Install the checker, the wheel and Scriptorium
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/checker/target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            libfontconfig1 fonts-dejavu-core poppler-utils
          cargo install --locked --path checker --root "$RUNNER_TEMP/portable"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv venv --python 3.12 "$RUNNER_TEMP/author"
          uv pip install --python "$RUNNER_TEMP/author/bin/python" "$RUNNER_TEMP"/wheels/*.whl pytest
          uv pip install --python "$RUNNER_TEMP/author/bin/python" \
            "scriptorium[pdf] @ git+https://github.com/gia-uh/scriptorium@9325898877e714b4f12f12c4e88650ab65c4fe09"

      - name: Check the public API inventory
        run: |
          python tools/generate_api_reference.py
          uvx --from git+https://github.com/apiad/rift@v0.9.0 rift check .

      - name: Test the chapters from the installed wheel
        run: |
          export PATH="$RUNNER_TEMP/portable/bin:$RUNNER_TEMP/author/bin:$PATH"
          python -m pytest -q tests/test_english_book.py tests/test_first_proof_chapter.py \
            tests/test_developer_guide.py tests/test_book_reading.py

      - name: Render the site and the PDF
        run: |
          export PATH="$RUNNER_TEMP/portable/bin:$RUNNER_TEMP/author/bin:$PATH"
          scriptorium render book/scriptorium.yaml --only site
          scriptorium render book/scriptorium.yaml --only print
          ! grep -rl 'Traceback (most recent call last)' book/site/*.html

      - name: Publish and validate the site surface
        run: |
          python tools/publish_book.py
          test -s book/site/book.pdf
          test -s book/site/CNAME
          test -f book/site/.nojekyll
          test -f book/site/guide/expressions.html

      - name: Build the wheel that carries the offline reading
        run: |
          python tools/package_reading.py
          uv build --wheel --out-dir "$RUNNER_TEMP/final-wheels"
          uv venv --python 3.12 "$RUNNER_TEMP/reader"
          uv pip install --python "$RUNNER_TEMP/reader/bin/python" "$RUNNER_TEMP"/final-wheels/*.whl

      - name: Check the offline entry from the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/reader/bin/python" -m logos book --json
          "$RUNNER_TEMP/reader/bin/python" "$GITHUB_WORKSPACE/tools/check_installed_reading.py"

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: english-book-site
          path: book/site
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the rendered site
        uses: actions/download-artifact@v4
        with:
          name: english-book-site
          path: book/site
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/site
          publish_branch: gh-pages
          force_orphan: true

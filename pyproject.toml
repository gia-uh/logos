[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-ai"
version = "0.1.0"
description = "A Lean-style proof kernel for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "The Logos authors"}]
keywords = [
    "theorem-proving",
    "proof-checker",
    "formal-verification",
    "logic",
    "mathematics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://logos.uhgia.org/"
Repository = "https://github.com/gia-uh/logos"
Issues = "https://github.com/gia-uh/logos/issues"
Changelog = "https://github.com/gia-uh/logos/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["logos", "logos.*"]

[tool.setuptools.package-data]
logos = ["py.typed", "_book/manifest.json", "_book/book.pdf", "_book/site/*", "_book/site/fonts/*", "_book/site/guide/*", "_book/site/guide/examples/*", "_book/site/guide/tactics/*", "_book/site/reference/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-ai"
version = "0.1.0"
description = "A Lean-style proof kernel for Python"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["logos", "logos.*"]

[tool.setuptools.package-data]
logos = ["py.typed", "_book/manifest.json", "_book/book.pdf", "_book/site/*", "_book/site/fonts/*", "_book/site/guide/*", "_book/site/guide/examples/*", "_book/site/guide/tactics/*", "_book/site/reference/*"]
